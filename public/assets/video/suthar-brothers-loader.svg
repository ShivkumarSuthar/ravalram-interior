<svg xmlns="http://www.w3.org/2000/svg" viewBox="-50 -22 660 660" width="240" height="240" role="img" aria-label="Suthar Brothers loading" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .s,.r{stroke-dasharray:1;stroke-dashoffset:1;animation-duration:3.2s;animation-iteration-count:infinite}
    .s{animation-name:sb-s}
    .r{animation-name:sb-r}
    .all{animation:sb-fade 3.2s ease infinite}
    @keyframes sb-s{0%{stroke-dashoffset:1;animation-timing-function:cubic-bezier(.45,0,.8,.6)}24.5%,100%{stroke-dashoffset:0}}
    @keyframes sb-r{0%,24.5%{stroke-dashoffset:1;animation-timing-function:cubic-bezier(.2,.4,.3,1)}62%,100%{stroke-dashoffset:0}}
    @keyframes sb-fade{0%,88%{opacity:1}100%{opacity:0}}
    @media (prefers-reduced-motion:reduce){.s,.r{animation:none;stroke-dashoffset:0}.all{animation:none}}
  </style>
  <defs>
    <mask id="sb-cuts" maskUnits="userSpaceOnUse" x="-100" y="-100" width="800" height="800">
      <rect x="-100" y="-100" width="800" height="800" fill="#fff"/>
      <g fill="none" stroke="#000" stroke-width="80">
        <path d="M136.5 406.3 A56 56 0 0 1 73.5 380.2"/>
        <path d="M135 260 L82.4 312.6 A56 56 0 0 0 69.4 371.4"/>
      </g>
      <circle cx="122" cy="352.2" r="30" fill="#000"/>
    </mask>
  </defs>
  <g class="all" fill="none" stroke="#C9A063" stroke-width="60" stroke-linecap="round" stroke-linejoin="round">
    <!-- one continuous line: S first, then on into the B, passing behind the S loop -->
    <path class="r" mask="url(#sb-cuts)" pathLength="1" d="M182.4 529.4 A60 60 0 0 1 80 487 V130 Q80 60 150 60 H260 Q330 60 330 130 V150 Q330 190 370 196 C445 210 490 270 490 355 C490 450 435 520 360 552"/>
    <path class="s" pathLength="1" d="M228 167 L82.4 312.6 A56 56 0 0 0 161.6 391.8 L258 295.4 A56 56 0 0 1 337.2 374.6 L182.4 529.4"/>
  </g>
</svg>
